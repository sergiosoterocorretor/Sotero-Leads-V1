<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Encontre o Imóvel dos Seus Sonhos - Sotero Imóveis</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #334155;
        }
        .container {
            background: #fff;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            margin-top: 0;
            color: #1e3a8a;
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .field {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        .msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sotero Imóveis</h1>
    <p class="subtitle">Preencha os dados abaixo para receber as melhores oportunidades em Salvador e região.</p>
    
    <form id="leadForm">
        <div class="field">
            <label>Nome Completo *</label>
            <input type="text" id="nome" placeholder="O seu nome" required>
        </div>
        
        <div class="field">
            <label>E-mail *</label>
            <input type="email" id="email" placeholder="exemplo@email.com" required>
        </div>
        
        <div class="field">
            <label>Telefone / WhatsApp *</label>
            <input type="tel" id="telefone" placeholder="(71) 99999-9999" required>
        </div>
        
        <div class="field">
            <label>Tipo de Imóvel Desejado</label>
            <select id="tipo_imovel">
                <option value="">Selecione...</option>
                <option>Apartamento</option>
                <option>Casa</option>
                <option>Terreno</option>
                <option>Comercial</option>
            </select>
        </div>
        
        <div class="field">
            <label>Faixa de Renda / Investimento</label>
            <select id="faixa_renda">
                <option value="">Selecione...</option>
                <option>Até R$ 5 mil</option>
                <option>R$ 5 mil a R$ 10 mil</option>
                <option>R$ 10 mil a R$ 20 mil</option>
                <option>Acima de R$ 20 mil</option>
            </select>
        </div>
        
        <div class="field">
            <label>Observações ou Preferências</label>
            <textarea id="observacoes" placeholder="Ex: Bairro específico, número de quartos..."></textarea>
        </div>
        
        <button type="submit" id="btnEnviar">Quero Receber Oportunidades</button>
        
        <div id="msg" class="msg"></div>
    </form>
</div>

<script>
document.getElementById('leadForm').onsubmit = async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('btnEnviar');
    const m = document.getElementById('msg');
    
    // Recolher os dados do formulário
    const d = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        telefone: document.getElementById('telefone').value,
        tipo_imovel: document.getElementById('tipo_imovel').value || null,
        faixa_renda: document.getElementById('faixa_renda').value || null,
        observacoes: document.getElementById('observacoes').value || null,
        consent_contact: true // Obrigatório para autorizar o envio na sua API
    };

    m.style.display = 'none';
    btn.disabled = true;
    btn.innerText = 'A enviar...';

    try {
        const r = await fetch('https://sotero-leads-v1.onrender.com/api/leads', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(d)
        });

        if (r.ok) {
            m.className = 'msg success';
            m.innerText = 'Obrigado! Os seus dados foram enviados com sucesso. Entraremos em contacto brevemente.';
            document.getElementById('leadForm').reset();
        } else {
            const err = await r.json();
            m.className = 'msg error';
            m.innerText = 'Erro: ' + (err.detail || 'Não foi possível concluir o envio.');
        }
    } catch (ex) {
        m.className = 'msg error';
        m.innerText = 'Erro de conexão com o servidor. Tente novamente mais tarde.';
    }
    
    m.style.display = 'block';
    btn.disabled = false;
    btn.innerText = 'Quero Receber Oportunidades';
};
</script>

</body>
  </html>
