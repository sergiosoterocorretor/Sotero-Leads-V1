<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sotero Leads</title><style>body{font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:760px;margin:30px auto;padding:20px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,select{width:100%;padding:11px;box-sizing:border-box;border:1px solid #ccd4df;border-radius:8px}label{font-size:13px;font-weight:700}.full{grid-column:1/-1}button{width:100%;padding:12px;background:#0d5bd7;color:white;border:0;border-radius:8px;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>SOTERO LEADS</h1><p>Receba atendimento personalizado.</p><form id="f"><div class="grid"><div><label>Nome</label><input name="name" required></div><div><label>WhatsApp</label><input name="phone" required></div><div><label>E-mail</label><input name="email" type="email"></div><div><label>Cidade</label><input name="city" value="Salvador"></div><div><label>Bairro/região</label><input name="neighborhood"></div><div><label>Nicho</label><select name="niche"><option>Imóveis</option><option>Locação</option><option>Consórcio</option><option>Terreno</option><option>Comercial</option><option>Rural</option></select></div><div><label>Produto/interesse</label><input name="product"></div><div><label>Orçamento</label><input name="budget"></div><div><label>Renda familiar</label><select name="income_range"><option>Até R$ 3 mil</option><option>R$ 3–5 mil</option><option>R$ 5–7 mil</option><option>R$ 8–10 mil</option><option>R$ 10–20 mil</option><option>R$ 20–30 mil</option><option>Acima de R$ 30 mil</option><option>Prefiro não informar</option></select></div><div><label>Entrada/reserva</label><input name="down_payment"></div><div><label>Prazo</label><select name="deadline"><option>Até 30 dias</option><option>31–90 dias</option><option>3–6 meses</option><option>Mais de 6 meses</option><option>Apenas pesquisando</option></select></div><div><label>Origem</label><select name="source"><option>Google</option><option>Instagram</option><option>Facebook</option><option>TikTok</option><option>Landing Page</option></select></div><div class="full"><label><input type="checkbox" name="consent" required> Autorizo o contato para tratar esta solicitação.</label></div></div><button>Enviar</button></form><p id="msg"></p></div></div><script>f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));d.consent_contact=true;let r=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});msg.textContent=r.ok?'Lead recebido.':'Não foi possível enviar.'}</script></body></html>
