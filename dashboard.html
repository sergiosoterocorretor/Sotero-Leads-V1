<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sotero Leads — Painel</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.top{background:#08182e;color:white;padding:25px}.wrap{max-width:1200px;margin:auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;padding:18px;border-radius:12px}.n{font-size:28px;font-weight:700}table{width:100%;margin-top:20px;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="top"><h1>SOTERO LEADS</h1>Central de captação e qualificação</div><div class="wrap"><div class="cards"><div class="card"><div class="n" id="t">0</div>Total</div><div class="card"><div class="n" id="h">0</div>Quentes</div><div class="card"><div class="n" id="m">0</div>Mornos</div><div class="card"><div class="n" id="f">0</div>Frios</div></div><table><thead><tr><th>Nome</th><th>Contato</th><th>Nicho</th><th>Origem</th><th>Palavra</th><th>Score</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><script>fetch('/api/leads').then(r=>r.json()).then(a=>{t.textContent=a.length;h.textContent=a.filter(x=>x.score>=80).length;m.textContent=a.filter(x=>x.score>=60&&x.score<80).length;f.textContent=a.filter(x=>x.score<60).length;rows.innerHTML=a.map(x=>`<tr><td>${x.name}</td><td>${x.phone||''}<br>${x.email||''}</td><td>${x.niche}</td><td>${x.source}</td><td>${x.keyword||''}</td><td>${x.score}</td><td>${x.status}</td></tr>`).join('')})</script></body></html>
